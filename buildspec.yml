version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11

  pre_build:
    commands:
      - echo "Installing dependencies..."
      - pip install -r requirements.txt

  build:
    commands:
      - echo "Running application checks..."
      - python -m py_compile app.py
      - echo "Build completed successfully."

artifacts:
  files:
    - '**/*'
